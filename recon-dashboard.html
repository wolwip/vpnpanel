<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Разведка · vpnpanel</title>
<style>
/* ── Токены. Слейт-консоль, severity — единственный цветовой канал со смыслом.
   Чтобы вписать в vpnpanel: замени значения на свои существующие переменные. ── */
:root{
  --bg:#10151c; --surface:#161d27; --surface-2:#1c2531; --border:#232e3c;
  --text:#d8e2ee; --muted:#7f8da0; --accent:#2dd4bf;
  --crit:#ff5b6e; --high:#ff9040; --warn:#f2c94c; --info:#54a8ff; --ok:#38cf8e;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:10px; --sp:16px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0); padding-bottom:env(safe-area-inset-bottom,0);
}
:root[data-theme="light"]{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#f0f3f7; --border:#dce3ec;
  --text:#1a2432; --muted:#5d6b7e; --accent:#0d9488;
  --crit:#e0364b; --high:#d9711b; --warn:#b8860b; --info:#2563eb; --ok:#0f9d63;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
.recon{max-width:1200px;margin:0 auto;padding:var(--sp)}
a{color:var(--accent)}
button{font-family:inherit;font-size:13px;cursor:pointer;border-radius:8px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text);padding:7px 12px;transition:border-color .12s,background .12s}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#04201c;font-weight:600}
:root[data-theme="light"] button.primary{color:#fff}
button.ghost{background:transparent}
button[disabled]{opacity:.5;cursor:default}
code,.mono{font-family:var(--mono);font-size:.92em}

/* topbar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:var(--sp)}
.top h1{font-size:19px;font-weight:650;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.top .sat{color:var(--accent)}
.top .spacer{flex:1}
.src{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--border);color:var(--muted)}
.src.live{color:var(--ok);border-color:var(--ok)}
.src.mock{color:var(--warn);border-color:var(--warn)}

/* overview grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tile{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:14px 16px 14px 18px;overflow:hidden;cursor:pointer;transition:border-color .12s}
.tile:hover{border-color:var(--accent)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile .spine{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--muted)}
.tile.sev-CRIT .spine{background:var(--crit)} .tile.sev-HIGH .spine{background:var(--high)}
.tile.sev-WARN .spine{background:var(--warn)} .tile.sev-INFO .spine{background:var(--info)}
.tile.sev-clean .spine{background:var(--ok)} .tile.sev-none .spine{background:var(--border)}
.tile .name{font-weight:600;font-size:15px}
.tile .target{font-family:var(--mono);color:var(--muted);font-size:12px;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .row{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.tile .meta{margin-left:auto;color:var(--muted);font-size:12px;font-family:var(--mono)}

/* severity pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;font-weight:600;
  padding:2px 8px;border-radius:6px;border:1px solid transparent}
.pill.CRIT{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,transparent);background:color-mix(in srgb,var(--crit) 12%,transparent)}
.pill.HIGH{color:var(--high);border-color:color-mix(in srgb,var(--high) 45%,transparent);background:color-mix(in srgb,var(--high) 12%,transparent)}
.pill.WARN{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.pill.INFO{color:var(--info);border-color:color-mix(in srgb,var(--info) 45%,transparent);background:color-mix(in srgb,var(--info) 12%,transparent)}
.pill.OK{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.pill.dim{color:var(--muted);border-color:var(--border)}

/* detail */
.detail-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card > h3{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.hoststrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 24px}
.hoststrip .f .k{color:var(--muted);font-size:12px}
.hoststrip .f .v{font-family:var(--mono);font-size:13px;word-break:break-word}

/* table */
table{width:100%;border-collapse:collapse;font-size:13px}
.tblwrap{overflow-x:auto}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:6px 10px;border-bottom:1px solid var(--border)}
td{padding:7px 10px;border-bottom:1px solid var(--border);font-family:var(--mono);vertical-align:top}
tr:last-child td{border-bottom:none}
.st{font-weight:700}
.st.open{color:var(--ok)} .st.closed{color:var(--crit)} .st.filtered{color:var(--warn)} .st.na{color:var(--muted)}
.src-tag{font-size:11px;color:var(--muted)} .src-tag .live{color:var(--ok)} .src-tag .cen{color:var(--info)}

/* tls cards */
.tls{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-family:var(--mono);font-size:12px}
.tls .port{color:var(--accent);font-weight:700}
.tls .kv{display:flex;gap:8px;margin-top:3px} .tls .kv .k{color:var(--muted);min-width:78px}

/* findings */
.finding{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.finding:last-child{border-bottom:none}
.finding .badge{flex:none;font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;height:fit-content}
.badge.CRIT{background:var(--crit);color:#fff} .badge.HIGH{background:var(--high);color:#231000}
.badge.WARN{background:var(--warn);color:#241f00} .badge.INFO{background:var(--info);color:#00142e}
.badge.OK{background:var(--ok);color:#00220f}
.finding .msg{font-size:13px} .finding .hint{color:var(--muted);font-size:12px;margin-top:3px}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--border)}
.tl-ev{position:relative;padding:0 0 18px}
.tl-ev::before{content:"";position:absolute;left:-19px;top:4px;width:10px;height:10px;border-radius:50%;
  background:var(--surface);border:2px solid var(--muted)}
.tl-ev.sev-CRIT::before{border-color:var(--crit)} .tl-ev.sev-HIGH::before{border-color:var(--high)}
.tl-ev.sev-WARN::before{border-color:var(--warn)} .tl-ev.sev-OK::before{border-color:var(--ok)}
.tl-ev.sev-INFO::before{border-color:var(--info)}
.tl-ev .when{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tl-ev .chips{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.chip{display:flex;gap:8px;align-items:baseline;font-size:13px}
.chip .dot{flex:none;width:7px;height:7px;border-radius:50%;margin-top:5px}
.chip.CRIT .dot{background:var(--crit)} .chip.HIGH .dot{background:var(--high)}
.chip.WARN .dot{background:var(--warn)} .chip.OK .dot{background:var(--ok)} .chip.INFO .dot{background:var(--info)}

.empty{color:var(--muted);padding:22px;text-align:center}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--muted);border-top-color:transparent;
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface-2);border:1px solid var(--border);border-left-width:3px;border-radius:8px;
  padding:10px 14px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.3);min-width:220px}
.toast.err{border-left-color:var(--crit)} .toast.ok{border-left-color:var(--ok)} .toast.info{border-left-color:var(--info)}
@media (max-width:520px){.recon{padding:12px}.top h1{font-size:17px}}
</style>
</head>
<body>
<div class="recon">
  <div class="top">
    <h1><span class="sat">🛰</span> Разведка <span id="src" class="src">…</span></h1>
    <div class="spacer"></div>
    <button id="back" class="ghost" style="display:none">← К обзору</button>
    <button id="scanAll" class="ghost">Сканировать все</button>
    <button id="refresh" class="ghost">Обновить</button>
    <button id="theme" class="ghost" title="Тема">◐</button>
  </div>
  <div id="view"></div>
</div>
<div id="toast"></div>

<script>
'use strict';
// ── конфиг ────────────────────────────────────────────────────────────────
// В vpnpanel apiBase='' → тот же origin, эндпоинты /api/recon/*.
// Открыт как файл или бэкенд недоступен → автоматически mock-режим.
const CFG = { apiBase: '' };
let MOCK = location.protocol === 'file:';

const $ = (s, r=document)=>r.querySelector(s);
const state = { view:'overview' };

// ── API с авто-фолбэком в mock ──────────────────────────────────────────────
async function api(path, opts){
  if (MOCK) return mock(path, opts);
  try{
    const r = await fetch(CFG.apiBase + path, {credentials:'same-origin', headers:{'Content-Type':'application/json'}, ...opts});
    if (r.status === 401){ toast('Нужна авторизация в панели','err'); throw new Error('401'); }
    if (!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  }catch(e){
    if (!MOCK){ MOCK = true; setSrc(); toast('Бэкенд недоступен — демо-данные','info'); return mock(path, opts); }
    throw e;
  }
}
function setSrc(){ const el=$('#src'); el.textContent = MOCK?'MOCK':'LIVE'; el.className='src '+(MOCK?'mock':'live'); }

// ── утилиты ──────────────────────────────────────────────────────────────
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ago(ts){ if(!ts) return '—'; const d=new Date(ts); if(isNaN(d)) return '—';
  const s=(Date.now()-d)/1000; if(s<90)return 'только что'; if(s<3600)return Math.round(s/60)+' мин назад';
  if(s<86400)return Math.round(s/3600)+' ч назад'; return Math.round(s/86400)+' дн назад'; }
function fdate(ts){ if(!ts) return '—'; const d=new Date(ts); return isNaN(d)?'—':
  d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function toast(msg,kind='info'){ const t=document.createElement('div'); t.className='toast '+kind; t.textContent=msg;
  $('#toast').appendChild(t); setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)},3200); }

// ── обзор ────────────────────────────────────────────────────────────────
async function showOverview(){
  state.view='overview'; $('#back').style.display='none';
  $('#view').innerHTML='<div class="empty"><span class="spin"></span> Загрузка…</div>';
  let data; try{ data = await api('/api/recon/overview'); }catch(e){ $('#view').innerHTML='<div class="empty">Не удалось загрузить</div>'; return; }
  if(!data.length){ $('#view').innerHTML='<div class="empty">Нет активов. Добавь серверы в панель и запусти скан.</div>'; return; }
  const grid=document.createElement('div'); grid.className='grid';
  for(const a of data){
    const sev = a.has_scan ? (a.worst_sev || 'clean') : 'none';
    const tile=document.createElement('div'); tile.className='tile sev-'+sev; tile.tabIndex=0;
    tile.setAttribute('role','button');
    const pills = a.counts ? ['CRIT','HIGH','WARN','INFO'].filter(k=>a.counts[k]>0)
      .map(k=>`<span class="pill ${k}">${k[0]} ${a.counts[k]}</span>`).join('') : '';
    tile.innerHTML=`<div class="spine"></div>
      <div class="name">${esc(a.name)}</div>
      <div class="target">${esc(a.target||'—')}</div>
      <div class="row">
        ${a.has_scan ? (pills || '<span class="pill OK">✓ чисто</span>') : '<span class="pill dim">нет скана</span>'}
        <span class="meta">${a.open_count!=null?a.open_count+' портов · ':''}${ago(a.scanned_at)}</span>
      </div>`;
    const open=()=>showDetail(a.asset_id, a.name);
    tile.onclick=open; tile.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}};
    grid.appendChild(tile);
  }
  $('#view').innerHTML=''; $('#view').appendChild(grid);
}

// ── детали + таймлайн ──────────────────────────────────────────────────────
async function showDetail(assetId, name){
  state.view='detail'; state.assetId=assetId; $('#back').style.display='';
  $('#view').innerHTML='<div class="empty"><span class="spin"></span> Загрузка…</div>';
  let d, tl;
  try{ [d, tl] = await Promise.all([ api('/api/recon/'+assetId), api('/api/recon/'+assetId+'/timeline') ]); }
  catch(e){ $('#view').innerHTML='<div class="empty">Не удалось загрузить</div>'; return; }

  const wrap=document.createElement('div');
  const head=document.createElement('div'); head.className='detail-head';
  head.innerHTML=`<h1 style="font-size:18px;margin:0">${esc(d.asset.name)}</h1>
    <span class="mono" style="color:var(--muted)">${esc(d.asset.target)}</span>`;
  const scanBtn=document.createElement('button'); scanBtn.className='primary'; scanBtn.textContent='Сканировать сейчас';
  scanBtn.style.marginLeft='auto';
  scanBtn.onclick=async()=>{ scanBtn.disabled=true; scanBtn.innerHTML='<span class="spin"></span> Скан…';
    try{ const r=await api('/api/recon/'+assetId+'/scan',{method:'POST',body:'{}'});
      toast('Скан завершён: '+(r.worstSev||'чисто'), r.worstSev==='CRIT'?'err':'ok'); showDetail(assetId,name);
    }catch(e){ toast('Ошибка скана: '+e.message,'err'); scanBtn.disabled=false; scanBtn.textContent='Сканировать сейчас'; } };
  head.appendChild(scanBtn); wrap.appendChild(head);

  if(!d.latest){ wrap.insertAdjacentHTML('beforeend','<div class="empty">Ещё не сканировался. Нажми «Сканировать сейчас».</div>');
    $('#view').innerHTML=''; $('#view').appendChild(wrap); return; }
  const m=d.latest;

  wrap.appendChild(hostStrip(m));
  wrap.appendChild(servicesCard(m));
  const tlsC=tlsCard(m); if(tlsC) wrap.appendChild(tlsC);
  wrap.appendChild(findingsCard(m));
  wrap.appendChild(timelineCard(tl));

  $('#view').innerHTML=''; $('#view').appendChild(wrap);
}

function field(k,v){ return `<div class="f"><div class="k">${k}</div><div class="v">${v||'—'}</div></div>`; }
function hostStrip(m){
  const c=m.censys||{}; const card=document.createElement('div'); card.className='card';
  const loc=[c.location?.city,c.location?.country].filter(Boolean).join(', ');
  const as=c.as?.asn?`AS${c.as.asn} ${esc(c.as.name||'')}`:'';
  card.innerHTML=`<h3>ХОСТ</h3><div class="hoststrip">
    ${field('IP',esc(m.ip))}
    ${m.domain?field('Домен',esc(m.domain)):''}
    ${c.rdns?field('rDNS',esc(c.rdns)):''}
    ${loc?field('Локация',esc(loc)):''}
    ${as?field('ASN',as+(c.as.prefix?` <span style="color:var(--muted)">${esc(c.as.prefix)}</span>`:'')):''}
    ${c.os?field('OS',esc(c.os)):''}
    ${c.labels?.length?field('Лейблы Censys',c.labels.map(l=>`<span class="pill WARN">${esc(l)}</span>`).join(' ')):''}
    ${c.lastUpdated?field('Скан Censys',fdate(c.lastUpdated)+` <span style="color:var(--muted)">(${ago(c.lastUpdated)})</span>`):''}
    ${m.censysError?field('Censys','<span style="color:var(--crit)">'+esc(m.censysError)+'</span>'):''}
  </div>`;
  return card;
}

function mergeRows(m){
  const map=new Map();
  for(const s of m.censys?.services||[]) map.set(s.port,{port:s.port,transport:s.transport||'TCP',
    name:s.name||'', detail:(s.software||[]).join(', ')||s.httpTitle||'', cen:true, live:null});
  for(const r of m.live?.ports||[]){ const cur=map.get(r.port)||{port:r.port,transport:'TCP',name:'',detail:'',cen:false};
    cur.live=r.state; map.set(r.port,cur); }
  for(const o of m.live?.open||[]){ const cur=map.get(o.port); if(!cur)continue;
    if(!cur.name) cur.name=o.http?.ok?'HTTP':(o.tls?.ok?'TLS':(o.banner?'BANNER':'open'));
    if(!cur.detail) cur.detail=o.http?.title||o.http?.server||o.tls?.subject||o.banner||''; }
  return [...map.values()].sort((a,b)=>a.port-b.port);
}
function servicesCard(m){
  const rows=mergeRows(m); const card=document.createElement('div'); card.className='card';
  const body=rows.map(r=>{
    const st=r.live||'na'; const glyph={open:'● открыт',closed:'○ закрыт',filtered:'◐ фильтр',na:'· —'}[st];
    const src=(r.cen?'<span class="cen">censys</span>':'')+(r.cen&&r.live==='open'?'+':'')+(r.live==='open'?'<span class="live">live</span>':'');
    return `<tr><td class="st ${st}">${glyph}</td><td>${r.port}/${(r.transport||'tcp').toLowerCase()}</td>
      <td>${esc(r.name||'—')}</td><td>${esc(r.detail||'—')}</td><td class="src-tag">${src||'—'}</td></tr>`;
  }).join('');
  card.innerHTML=`<h3>СЕРВИСЫ</h3><div class="tblwrap"><table>
    <thead><tr><th>Статус</th><th>Порт</th><th>Сервис</th><th>ПО / Title</th><th>Источник</th></tr></thead>
    <tbody>${body||'<tr><td colspan=5 class="st na">нет данных</td></tr>'}</tbody></table></div>`;
  return card;
}

function tlsCard(m){
  const tls=(m.live?.open||[]).filter(o=>o.tls?.ok); if(!tls.length) return null;
  const card=document.createElement('div'); card.className='card';
  card.innerHTML='<h3>TLS (живой скан)</h3>'+tls.map(o=>{
    const t=o.tls; const kv=(k,v)=>`<div class="kv"><span class="k">${k}</span><span>${esc(v||'—')}</span></div>`;
    return `<div class="tls"><div class="port">:${o.port}</div>
      <div style="color:var(--muted)">${[t.protocol,t.alpn&&('ALPN '+t.alpn),t.cipher].filter(Boolean).map(esc).join(' · ')}</div>
      ${kv('CN',t.subject)}${kv('Issuer',t.issuer)}${t.san?kv('SAN',t.san):''}${kv('Годен до',t.validTo)}
      ${t.fp256?kv('FP256',t.fp256.slice(0,48)+'…'):''}</div>`;
  }).join('');
  return card;
}

function findingsCard(m){
  const card=document.createElement('div'); card.className='card';
  const f=m.findings||[];
  const body = f.length ? f.map(x=>`<div class="finding">
      <span class="badge ${x.sev}">${x.sev}</span>
      <div><div class="msg">${esc(x.msg)}</div>${x.hint?`<div class="hint">↳ ${esc(x.hint)}</div>`:''}</div>
    </div>`).join('') : '<div class="finding"><span class="badge OK">OK</span><div class="msg">Ничего критичного не обнаружено</div></div>';
  card.innerHTML=`<h3>НАХОДКИ${f.length?` (${f.length})`:''}</h3>${body}`;
  return card;
}

function timelineCard(tl){
  const card=document.createElement('div'); card.className='card';
  if(!tl||!tl.length){ card.innerHTML='<h3>ТАЙМЛАЙН</h3><div class="empty">История появится после второго скана.</div>'; return card; }
  const ev=tl.map(e=>{
    const worst=e.changes.reduce((w,c)=>{const o={CRIT:0,HIGH:1,WARN:2,INFO:3,OK:4};return o[c.sev]<o[w]?c.sev:w;},'OK');
    const chips=e.changes.map(c=>`<div class="chip ${c.sev}"><span class="dot"></span><span>${esc(c.text)}</span></div>`).join('');
    return `<div class="tl-ev sev-${worst}"><div class="when">${fdate(e.at)} · ${ago(e.at)}</div><div class="chips">${chips}</div></div>`;
  }).join('');
  card.innerHTML=`<h3>ТАЙМЛАЙН ИЗМЕНЕНИЙ</h3><div class="tl">${ev}</div>`;
  return card;
}

// ── сканировать все ─────────────────────────────────────────────────────────
async function scanAll(){
  const btn=$('#scanAll'); btn.disabled=true; const old=btn.textContent; btn.innerHTML='<span class="spin"></span> Скан…';
  try{ const list=await api('/api/recon/overview');
    for(const a of list){ try{ await api('/api/recon/'+a.asset_id+'/scan',{method:'POST',body:'{}'}); }catch(e){} }
    toast('Скан всех активов завершён','ok');
    state.view==='overview'?showOverview():showDetail(state.assetId);
  }catch(e){ toast('Ошибка: '+e.message,'err'); }
  btn.disabled=false; btn.textContent=old;
}

// ── тема (для standalone; в панели темой рулит сам vpnpanel) ─────────────────
function initTheme(){ const s=localStorage.getItem('recon-theme'); if(s) document.documentElement.dataset.theme=s;
  else if(matchMedia('(prefers-color-scheme:light)').matches) document.documentElement.dataset.theme='light'; }
$('#theme').onclick=()=>{ const cur=document.documentElement.dataset.theme==='light'?'dark':'light';
  document.documentElement.dataset.theme=cur; localStorage.setItem('recon-theme',cur); };
$('#back').onclick=showOverview;
$('#refresh').onclick=()=>state.view==='overview'?showOverview():showDetail(state.assetId);
$('#scanAll').onclick=scanAll;

// ── mock-бэкенд (демо-данные + тот же diff, что на сервере) ───────────────────
function mock(path, opts){
  const M = mock.db || (mock.db = buildMock());
  const seg = path.split('/').filter(Boolean); // api recon ...
  if(path==='/api/recon/overview') return Promise.resolve(M.overview());
  const id = +seg[2];
  if(seg[4]==='timeline') return Promise.resolve(M.timeline(id));
  if(seg[3]==='scan' && opts?.method==='POST') return Promise.resolve(M.scan(id));
  return Promise.resolve(M.detail(id));
}
function mockDiff(prev,cur){ // копия diffSnapshots из recon-routes.js
  const ops=(m)=>{const s=new Set();for(const o of m.live?.open||[])s.add(o.port);if(!s.size)for(const v of m.censys?.services||[])s.add(v.port);return s;};
  const fp=(m)=>{const x=new Map();for(const o of m.live?.open||[])if(o.tls?.ok&&o.tls.fp256)x.set(o.port,o.tls.fp256);return x;};
  const fk=(m)=>{const x=new Map();for(const f of m.findings||[])x.set(f.sev+'|'+f.msg,f);return x;};
  const ch=[]; const pP=ops(prev),cP=ops(cur);
  for(const p of cP)if(!pP.has(p))ch.push({sev:'WARN',text:`Открылся порт :${p}`});
  for(const p of pP)if(!cP.has(p))ch.push({sev:'OK',text:`Закрылся порт :${p}`});
  const pf=fp(prev),cf=fp(cur); for(const[p,v]of cf){const o=pf.get(p);if(o&&o!==v)ch.push({sev:'WARN',text:`Сменился TLS-сертификат на :${p}`});}
  const pF=fk(prev),cF=fk(cur);
  for(const[k,f]of cF)if(!pF.has(k))ch.push({sev:f.sev,text:`Новая находка: ${f.msg}`});
  for(const[k,f]of pF)if(!cF.has(k))ch.push({sev:'OK',text:`Устранено: ${f.msg}`});
  const pL=new Set(prev.censys?.labels||[]),cL=new Set(cur.censys?.labels||[]);
  for(const l of cL)if(!pL.has(l))ch.push({sev:'WARN',text:`Censys добавил лейбл "${l}"`});
  const o={CRIT:0,HIGH:1,WARN:2,INFO:3,OK:4}; ch.sort((a,b)=>o[a.sev]-o[b.sev]); return ch;
}
function buildMock(){
  const now=Date.now(), H=3600e3, D=24*H;
  const base=(over)=>({target:'demo',ip:'203.0.113.10',domain:null,censysError:null,
    censys:{present:true,ip:'203.0.113.10',lastUpdated:new Date(now-2*D).toISOString(),
      location:{city:'Amsterdam',country:'NL'},as:{asn:200000,name:'EXAMPLE-VPS',prefix:'203.0.113.0/24'},
      os:'Ubuntu 24.04',rdns:'vps.example.net',labels:[],services:[{port:22,transport:'TCP',name:'SSH',software:['OpenSSH 9.6']},{port:443,transport:'TCP',name:'HTTPS',software:['nginx']}]},
    live:{ip:'203.0.113.10',scannedAt:new Date().toISOString(),
      ports:[{port:22,state:'open'},{port:443,state:'open'}],
      open:[{port:22,banner:'SSH-2.0-OpenSSH_9.6'},{port:443,tls:{ok:true,protocol:'TLSv1.3',alpn:'h2',cipher:'TLS_AES_256_GCM_SHA384',subject:'www.microsoft.com',issuer:'Microsoft RSA TLS CA',validTo:'Jan 01 2027 GMT',fp256:'a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6'}}]},
    findings:[],worstSev:null,...over});
  // сервер A: три снимка — деградация (открылась панель и SOCKS), потом починка
  const s1=base(); s1.live.scannedAt=new Date(now-3*D).toISOString();
  const s2=JSON.parse(JSON.stringify(s1)); s2.live.scannedAt=new Date(now-1*D).toISOString();
  s2.censys.labels=['LOGIN_PAGE'];
  s2.live.ports.push({port:54321,state:'open'},{port:1080,state:'open'});
  s2.live.open.push({port:54321,http:{ok:true,status:200,title:'3X-UI Login',server:'nginx'}},{port:1080,socks5:true});
  s2.findings=[{sev:'CRIT',msg:'SOCKS5-прокси открыт наружу на :1080',hint:'gost должен слушать 127.0.0.1'},
    {sev:'HIGH',msg:'Панель управления открыта на :54321 (3X-UI Login)',hint:'вынеси панель на localhost + SSH-туннель'}];
  s2.worstSev='CRIT';
  const s3=JSON.parse(JSON.stringify(s1)); s3.live.scannedAt=new Date(now-2*H).toISOString();
  s3.findings=[]; s3.worstSev=null;
  const A={id:1,name:'nl-reality-01',target:'203.0.113.10',snaps:[s1,s2,s3]};
  // сервер B: чистый, один снимок
  const b1=base(); b1.ip='198.51.100.5'; b1.censys.ip='198.51.100.5'; b1.live.ip='198.51.100.5';
  const B={id:2,name:'beget-vpn',target:'198.51.100.5',snaps:[b1]};
  // сервер C: ещё не сканировался
  const C={id:3,name:'de-hop-02',target:'hop.example.org',snaps:[]};
  const all={1:A,2:B,3:C};
  const cnt=(f)=>{const c={CRIT:0,HIGH:0,WARN:0,INFO:0};for(const x of f||[])if(c[x.sev]!=null)c[x.sev]++;return c;};
  return {
    overview:()=>Object.values(all).map(x=>{const last=x.snaps[x.snaps.length-1];
      return {asset_id:x.id,name:x.name,target:x.target,has_scan:!!last,
        scanned_at:last?.live.scannedAt||null,worst_sev:last?.worstSev||null,
        counts:last?cnt(last.findings):null,open_count:last?last.live.open.length:null};}),
    detail:(id)=>{const x=all[id]; const last=x.snaps[x.snaps.length-1];
      return {asset:{id:x.id,name:x.name,target:x.target}, latest:last||null,
        snapshots:x.snaps.map((s,i)=>({id:i+1,scanned_at:s.live.scannedAt,worst_sev:s.worstSev,counts:cnt(s.findings),open_count:s.live.open.length})).reverse()};},
    timeline:(id)=>{const x=all[id]; if(!x.snaps.length) return [];
      const t=[{at:x.snaps[0].live.scannedAt,changes:[{sev:'INFO',text:'Первый снимок — базовая точка отсчёта'}]}];
      for(let i=1;i<x.snaps.length;i++){const ch=mockDiff(x.snaps[i-1],x.snaps[i]); if(ch.length)t.push({at:x.snaps[i].live.scannedAt,changes:ch});}
      return t.reverse();},
    scan:(id)=>{const x=all[id]; const last=x.snaps[x.snaps.length-1]||base();
      const ns=JSON.parse(JSON.stringify(last)); ns.live.scannedAt=new Date().toISOString();
      x.snaps.push(ns); return {worstSev:ns.worstSev,counts:cnt(ns.findings),findings:ns.findings,model:ns};},
  };
}
